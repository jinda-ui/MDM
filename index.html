<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>國軍 MDM V9.1</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
-webkit-user-select:none;
user-select:none;
}

html,body{
height:100%;
}

body{

background:#73d34f;

overflow-x:hidden;

}

/*==========================
Header
===========================*/

.top{

position:fixed;

top:0;

left:0;

right:0;

height:72px;

padding-top:env(safe-area-inset-top);

background:#000;

display:flex;

justify-content:center;

align-items:center;

color:white;

font-size:25px;

font-weight:700;

z-index:999;

}

.menu{

position:absolute;

left:18px;

font-size:34px;

cursor:pointer;

}

.version{

position:absolute;

right:14px;

font-size:18px;

font-weight:500;

}

/*==========================
Content
===========================*/

.content{

padding-top:110px;

padding-bottom:60px;

text-align:center;

}

.tip{

font-size:21px;

margin-top:8px;

font-weight:500;

}

.name{

font-size:112px;

font-weight:700;

margin-top:70px;

letter-spacing:2px;

}

.clock{

font-size:72px;

font-weight:800;

margin-top:70px;

}

/*==========================
Buttons
===========================*/

.btn{

width:86%;

height:78px;

margin:28px auto;

background:rgba(255,255,255,.33);

border-radius:18px;

display:flex;

justify-content:center;

align-items:center;

font-size:35px;

color:#4d73ff;

backdrop-filter:blur(8px);

}

.dot{

width:28px;

height:28px;

border-radius:50%;

margin-right:18px;

}

.green{

background:#59d33c;

box-shadow:0 0 10px rgba(65,180,40,.8);

}

.red{

background:#ff4545;

box-shadow:0 0 10px rgba(255,0,0,.5);

}

/*==========================
Card
===========================*/

.card{

width:82%;

margin:45px auto;

padding:30px;

background:#fff;

border-radius:16px;

border:2px solid #444;

position:relative;

overflow:hidden;

}

.card::before{

content:"";

position:absolute;

inset:0;

opacity:.12;

background-image:
radial-gradient(circle,#999 2px,transparent 2px);

background-size:95px 95px;

pointer-events:none;

}

.card-title{

position:relative;

z-index:2;

font-size:28px;

line-height:42px;

}

.serial{

position:relative;

z-index:2;

font-size:64px;

font-weight:800;

margin-top:20px;

letter-spacing:2px;

}

/*==========================
Info
===========================*/

.info{

font-size:28px;

line-height:65px;

margin-top:10px;

}

.fake{

margin-top:10px;

font-size:30px;

font-weight:700;

color:#e00;

letter-spacing:4px;

}

/*==========================
Drawer
===========================*/

.drawer{

position:fixed;

top:0;

left:-280px;

width:280px;

height:100%;

background:white;

box-shadow:5px 0 18px rgba(0,0,0,.35);

transition:.3s;

z-index:1200;

padding-top:90px;

}

.drawer.show{

left:0;

}

.drawer h2{

padding:20px;

font-size:28px;

border-bottom:1px solid #ddd;

}

.drawer a{

display:block;

padding:22px;

font-size:24px;

text-decoration:none;

color:#333;

border-bottom:1px solid #eee;

}

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.4);

display:none;

z-index:1100;

}

.overlay.show{

display:block;

}

/*==========================
Animation
===========================*/

.btn:active{

transform:scale(.98);

transition:.08s;

}

.card{

animation:fade .4s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="drawer" id="drawer">

<h2>國軍 MDM</h2>

<a href="#">首頁</a>

<a href="#">管理模式</a>

<a href="#">設定資訊</a>

<a href="#">版本資訊</a>

</div>

<div class="overlay" id="overlay"></div>

<div class="top">

<div class="menu" id="menu">☰</div>

國軍 MDM V9.1

<div class="version" id="ios"></div>

</div>

<div class="content">

<div class="tip">

已上鎖，可進入此管制營區

</div>

<div class="name">

中科院

</div>

<div class="clock" id="clock">

00/00 00:00:00

</div>

<div class="btn">

<div class="dot green"></div>

上鎖：進入管制模式

</div>

<div class="btn">

<div class="dot red"></div>

解鎖：離開管制模式

</div>

<div class="card">

<div class="card-title">

國軍營內民用通信<br>

資訊器材管制標籤

</div>

<div class="serial">

C228914264

</div>

</div>

<div class="info">

上鎖時間：115/07/02 10:06:36<br>

設定檔：V113.a (12/30 11:17:24)

</div>

<div class="fake">

仿冒必究

</div>

</div>



<script>

//==============================
// iOS Version
//==============================

const match = navigator.userAgent.match(/OS (\d+[_\d]*)/);

document.getElementById("ios").textContent =
match ? "iOS:" + match[1].replaceAll("_",".") : "";

//==============================
// Clock
//==============================

function updateClock(){

const d=new Date();

const month=String(d.getMonth()+1).padStart(2,"0");

const day=String(d.getDate()).padStart(2,"0");

const hour=String(d.getHours()).padStart(2,"0");

const min=String(d.getMinutes()).padStart(2,"0");

const sec=String(d.getSeconds()).padStart(2,"0");

document.getElementById("clock").textContent=
`${month}/${day} ${hour}:${min}:${sec}`;

}

updateClock();

setInterval(updateClock,1000);

//==============================
// Drawer
//==============================

const drawer=document.getElementById("drawer");
const overlay=document.getElementById("overlay");
const menu=document.getElementById("menu");

menu.onclick=()=>{

drawer.classList.add("show");
overlay.classList.add("show");

};

overlay.onclick=()=>{

drawer.classList.remove("show");
overlay.classList.remove("show");

};

//==============================
// Button Animation
//==============================

document.querySelectorAll(".btn").forEach(btn=>{

btn.addEventListener("touchstart",()=>{

btn.style.transform="scale(.97)";
btn.style.transition=".08s";

});

btn.addEventListener("touchend",()=>{

btn.style.transform="scale(1)";

});

});

//==============================
// Card Animation
//==============================

window.addEventListener("load",()=>{

document.querySelector(".card").style.opacity="1";

});

//==============================
// Optional vibration
//==============================

document.querySelectorAll(".btn").forEach(btn=>{

btn.addEventListener("click",()=>{

if(navigator.vibrate){

navigator.vibrate(15);

}

});

});

</script>

</body>

</html>
