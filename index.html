<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>國軍 MDM V9.1 Ultra</title>

    <meta name="theme-color" content="#000000">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         Header
    ========================== -->

    <header class="topbar">

        <button id="menuButton" class="menu-button">

            ☰

        </button>

        <div class="app-title">

            國軍 MDM V9.1

        </div>

        <div id="iosVersion" class="ios-version">

            iOS

        </div>

    </header>



    <!-- =========================
         Main
    ========================== -->

    <main class="container">

        <!-- 一般模式 -->

        <section
            id="statusSection"
            class="status-section">

            <div
                id="statusText"
                class="status">

                已上鎖，可進入此管制營區

            </div>

        </section>


<!-- 任務模式 -->

<section
    id="endTimeSection"
    class="endtime-section hidden">

    <div
        id="endTimeLabel"
        class="endtime-label">

        結束時間

    </div>

    <div
        id="endTimeValue"
        class="endtime">

        115/08/14 00:00

    </div>

</section>



        <!-- 標題 -->

        <section
            id="titleSection"
            class="title-section">

            <h1
                id="pageTitle"
                class="page-title">

                任務模式

            </h1>

        </section>



        <!-- 時鐘 -->

        <section
            id="clockSection"
            class="clock-section">

            <div
                id="currentTime"
                class="clock">

                115/08/05 00:00:00

            </div>

        </section>



        <!-- 按鈕 -->

        <section class="button-section">

            <button
                id="lockButton"
                class="mdm-button">

                <span class="led green"></span>

                <span>

                    上鎖：進入管制模式

                </span>

            </button>



            <button
                id="unlockButton"
                class="mdm-button">

                <span class="led red"></span>

                <span>

                    解鎖：離開管制模式

                </span>

            </button>

        </section>



        <!-- 管制卡 -->

        <section class="card-section">

            <div class="control-card">

                <div class="card-watermark">

                    <!-- SVG 浮水印預留 -->

                </div>

                <div class="card-title">

                    國軍營內民用通信

                </div>

                <div class="card-subtitle">

                    資訊器材管制標籤

                </div>

                <div
                    id="serialNumber"
                    class="serial-number">

                    C228914264

                </div>

            </div>

        </section>



        <!-- 資訊 -->

        <section class="info-section">

            <div>

                上鎖時間：

                <span id="lockTime">

                    115/07/02 10:06:36

                </span>

            </div>

            <div>

                設定檔：

                <span id="profileVersion">

                    V113.a (12/30 11:17:24)

                </span>

            </div>

        </section>



        <!-- 違規項目 -->

        <section
            id="violationSection"
            class="violation-section hidden">

            <div class="violation-title">

                違規項目

            </div>

            <div
                id="violationItems"
                class="violation-items">
                通知聲音、通知

            </div>

        </section>



        <!-- Footer -->

        <footer class="footer">

            仿冒必究

        </footer>

    </main>

<!-- ==========================================================
     Admin Panel
========================================================== -->

<section
    id="adminPanel"
    class="admin-panel hidden">

    <div class="admin-header">

        管理者模式

    </div>

    <div class="admin-body">

        <!-- 模式 -->

        <label>

            模式

        </label>

        <select id="adminMode">

            <option value="normal">

                一般模式

            </option>

            <option value="mission">

                任務模式

            </option>

        </select>

        <!-- 營區名稱 -->

        <label>

            營區名稱

        </label>

        <input
            id="adminTitle"
            type="text"
            value="中科院">

        <!-- 上鎖時間 -->

        <label>

            上鎖時間

        </label>

        <input
            id="adminLockTime"
            type="text"
            placeholder="115/07/02 10:06:36">

        <!-- 結束時間 -->

        <label>

            結束時間

        </label>

        <input
            id="adminEndTime"
            type="text"
            placeholder="115/08/14 00:00">

        <!-- 管制標籤第一行 -->

        <label>

            管制標籤第一行

        </label>

        <input
            id="adminCardTitle"
            type="text"
            value="國軍營內民用通信">

        <!-- 管制標籤第二行 -->

        <label>

            管制標籤第二行

        </label>

        <input
            id="adminCardSubtitle"
            type="text"
            value="資訊器材管制標籤">

        <!-- 卡號 -->

        <label>

            卡號

        </label>

        <input
            id="adminSerial"
            type="text"
            value="C228914264">

        <!-- 套用 -->

        <button
            id="saveAdmin"
            class="admin-save">

            套用設定

        </button>

    </div>

</section>

    <!-- ==========================================================
     Drawer
========================================================== -->

<aside
    id="drawer"
    class="drawer">

    <div class="drawer-header">

        國軍 MDM V9.1

    </div>

    <div class="drawer-menu">

        <div
            id="drawerHome"
            class="drawer-item">

            🏠 首頁

        </div>

        <div
            id="drawerAdmin"
            class="drawer-item">

            ⚙️ 管理者模式

        </div>

        <div
            id="drawerAbout"
            class="drawer-item">

            ℹ️ 關於

        </div>

    </div>

    <div class="drawer-footer">

        Version 9.1 Ultra

    </div>

</aside>



    <!-- Overlay -->

    <div
        id="overlay"
        class="overlay">

    </div>



    <script src="config.js"></script>

    <script src="script.js"></script>

</body>

</html>
