<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1,viewport-fit=cover">

    <title>國軍 MDM V9.1 Ultra</title>

    <meta name="theme-color" content="#000000">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         Header
    ========================== -->

    <header class="topbar">

        <button id="menuButton" class="menu-button">

            ☰

        </button>

        <div class="app-title">

            國軍 MDM V9.1

        </div>

        <div id="iosVersion" class="ios-version">

            iOS

        </div>

    </header>



    <!-- =========================
         Main
    ========================== -->

    <main class="container">


<!-- =========================
     Normal Mode Status
========================== -->

<section
    id="statusSection"
    class="status-section">

    <div
        id="statusText"
        class="status">

        已上鎖，可進入此管制營區

    </div>

</section>



<!-- =========================
     Mission End Time
========================== -->

<section
    id="endTimeSection"
    class="endtime-section hidden">

    <div class="endtime-label">

        結束時間

    </div>

    <div
        id="endTimeValue"
        class="endtime">

        115/08/14 00:00

    </div>

</section>



<!-- =========================
     Page Title
========================== -->

<section
    id="titleSection"
    class="title-section">

    <h1
        id="pageTitle"
        class="page-title">

        中科院

    </h1>

</section>



<!-- =========================
     Clock
========================== -->

<section
    id="clockSection"
    class="clock-section">

    <div
        id="currentTime"
        class="clock">

        115/08/05 00:00:00

    </div>



        </section>



        <!-- 即時時間 -->

        <section class="clock-section">

            <div id="currentTime">

                115/08/05 00:00:00

            </div>

        </section>



        <!-- 任務結束時間 -->

        <section
            id="endTimeSection"
            class="endtime-section">

            <div class="endtime-title">

                結束時間

            </div>

            <div
                id="endTimeValue"
                class="endtime-value">

                115/08/14 00:00

            </div>

        </section>



        <!-- 上鎖 -->

        <section class="button-section">

            <button
                id="lockButton"
                class="mdm-button">

                <span class="led green"></span>

                <span>

                    上鎖：進入管制模式

                </span>

            </button>



            <button
                id="unlockButton"
                class="mdm-button">

                <span class="led red"></span>

                <span>

                    解鎖：離開管制模式

                </span>

            </button>

        </section>



        <!-- 卡片 -->

        <section class="card-section">

            <div class="control-card">

                <div class="card-watermark">

                    <!-- v0.3 放 SVG -->

                </div>

                <div class="card-title">

                    國軍營內民用通信

                </div>

                <div class="card-subtitle">

                    資訊器材管制標籤

                </div>

                <div
                    id="serialNumber"
                    class="serial-number">

                    C228914264

                </div>

            </div>

        </section>



        <!-- 資訊 -->

        <section class="info-section">

            <div>

                上鎖時間：

                <span id="lockTime">

                    115/07/02 10:06:36

                </span>

            </div>

            <div>

                設定檔：

                <span id="profileVersion">

                    V113.a (12/30 11:17:24)

                </span>

            </div>

        </section>



        <section
    id="violationSection"
    class="violation-section hidden">

    <div class="violation-title">

        違規項目

    </div>

    <div
        id="violationItems">

        通知聲音、通知

    </div>

</section>



        <!-- 底部 -->

        <footer class="footer">

            仿冒必究

        </footer>

    </main>



    <!-- Drawer (v0.2) -->

    <aside
        id="drawer"
        class="drawer">

    </aside>



    <!-- Overlay -->

    <div
        id="overlay"
        class="overlay">

    </div>



    <script src="config.js"></script>

    <script src="script.js"></script>

</body>

</html>
