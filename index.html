<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="國軍 MDM">

    <meta name="theme-color" content="#000000">

    <title>國軍 MDM V9.1</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ==========================================================
     Header
========================================================== -->

<header class="topbar">

    <button
        id="menuButton"
        class="menu-button">

        ☰

    </button>

    <div class="app-title">

        國軍 MDM V9.1

    </div>

</header>


<!-- ==========================================================
     Main
========================================================== -->

<main class="container fade">

    <!-- iOS Version -->

    <div
        id="iosVersion"
        class="ios-version">

        iOS:26.0

    </div>


    <!-- =========================
         一般模式
    ========================== -->

    <section
        id="statusSection"
        class="status-section hidden">

        <div
            id="statusText"
            class="status">

            已上鎖，可進入此管制營區

        </div>

    </section>


    <!-- =========================
         任務模式
    ========================== -->

    <section
        id="endTimeSection"
        class="endtime-section">

        <span
            id="endTimeLabel"
            class="endtime-label">

            結束時間：

        </span>

        <span
            id="endTimeValue"
            class="endtime">

            115/08/14 00:00

        </span>

    </section>


    <!-- =========================
         標題
    ========================== -->

    <section
        id="titleSection"
        class="title-section">

        <h1
            id="pageTitle"
            class="page-title">

            任務模式

        </h1>

    </section>


    <!-- =========================
         時鐘
    ========================== -->

    <section
        id="clockSection"
        class="clock-section">

        <div
            id="currentTime"
            class="clock">

            115/08/05 00:00:00

        </div>

    </section>


    <!-- =========================
         按鈕
    ========================== -->

<section class="button-section">

    <button
        id="lockButton"
        class="mdm-button">

        <span class="led green"></span>

        <span>

            上鎖：進入管制模式

        </span>

    </button>

    <button
        id="unlockButton"
        class="mdm-button">

        <span class="led red"></span>

        <span>

            解鎖：離開管制模式

        </span>

    </button>

</section>


<!-- ==========================================================
     管制卡
========================================================== -->

<section class="card-section">

    <div class="control-card">

        <!-- 浮水印 -->

        <div class="card-watermark"></div>

        <!-- 第一行 -->

        <div
            id="cardTitle"
            class="card-title">

            國軍營內民用通信

        </div>

        <!-- 第二行 -->

        <div
            id="cardSubtitle"
            class="card-subtitle">

            資訊器材管制標籤

        </div>

        <!-- 卡號 -->

        <div
            id="serialNumber"
            class="serial-number">

            C228914264

        </div>

    </div>

</section>


<!-- ==========================================================
     資訊
========================================================== -->

<section class="info-section">

    <div class="info-row">

        <span>

            上鎖時間：

        </span>

        <span
            id="lockTime">

            115/07/02 10:06:36

        </span>

    </div>

    <div class="info-row">

        <span>

            設定檔：

        </span>

        <span
            id="profileVersion">

            V113.a (12/30 11:17:24)

        </span>

    </div>

</section>


<!-- ==========================================================
     違規項目
========================================================== -->

<section
    id="violationSection"
    class="violation-section hidden">

    <div class="violation-title">

        違規項目

    </div>

    <div
        id="violationItems"
        class="violation-items">

        通知聲音、通知

    </div>

</section>


<!-- ==========================================================
     Footer
========================================================== -->

<footer class="footer">

    仿冒必究

</footer>

</main>

<!-- ==========================================================
     Admin Panel
========================================================== -->

<section
    id="adminPanel"
    class="admin-panel hidden">

    <div class="admin-header">

        管理者模式

    </div>

    <div class="admin-body">

        <!-- 模式 -->

        <label for="adminMode">

            顯示模式

        </label>

        <select id="adminMode">

            <option value="normal">

                一般模式

            </option>

            <option value="mission" selected>

                任務模式

            </option>

        </select>


        <!-- 標題 -->

        <label for="adminTitle">

            營區名稱

        </label>

        <input
            id="adminTitle"
            type="text"
            value="任務模式">


        <!-- 上鎖時間 -->

        <label for="adminLockTime">

            上鎖時間

        </label>

        <input
            id="adminLockTime"
            type="text"
            value="115/07/02 10:06:36">


        <!-- 任務結束 -->

        <label for="adminEndTime">

            結束時間

        </label>

        <input
            id="adminEndTime"
            type="text"
            value="115/08/14 00:00">


        <!-- 第一行 -->

        <label for="adminCardTitle">

            管制標籤（第一行）

        </label>

        <input
            id="adminCardTitle"
            type="text"
            value="國軍營內民用通信">


        <!-- 第二行 -->

        <label for="adminCardSubtitle">

            管制標籤（第二行）

        </label>

        <input
            id="adminCardSubtitle"
            type="text"
            value="資訊器材管制標籤">


        <!-- 卡號 -->

        <label for="adminSerial">

            卡號

        </label>

        <input
            id="adminSerial"
            type="text"
            value="C228914264">


        <!-- 套用 -->

        <button
            id="saveAdmin"
            class="admin-save">

            套用設定

        </button>


        <!-- 關閉 -->

        <button
            id="closeAdmin"
            class="admin-cancel">

            關閉

        </button>

    </div>

</section>

<!-- ==========================================================
     Drawer
========================================================== -->

<aside
    id="drawer"
    class="drawer">

    <div class="drawer-header">

        國軍 MDM V9.1

    </div>

    <div class="drawer-menu">

        <div
            id="drawerHome"
            class="drawer-item">

            <span class="drawer-icon">🏠</span>

            <span>首頁</span>

        </div>

        <div
            id="drawerAdmin"
            class="drawer-item">

            <span class="drawer-icon">⚙️</span>

            <span>管理者模式</span>

        </div>

        <div
            id="drawerAbout"
            class="drawer-item">

            <span class="drawer-icon">ℹ️</span>

            <span>關於</span>

        </div>

    </div>

    <div class="drawer-footer">

        MDM V9.1 Ultra<br>

        Build 2026.08

    </div>

</aside>


<!-- ==========================================================
     Overlay
========================================================== -->

<div
    id="overlay"
    class="overlay">

</div>


<!-- ==========================================================
     Script
========================================================== -->

<script src="config.js"></script>

<script src="script.js"></script>

</body>

</html>
