<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDM Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#1976d2;
color:white;
padding:20px;
font-size:28px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:white;
border-radius:12px;
overflow:hidden;
}

th{
background:#1976d2;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #eee;
text-align:center;
}

.online{
color:green;
font-weight:bold;
}

.offline{
color:red;
font-weight:bold;
}
</style>

</head>

<body>

<header>
📱 MDM Dashboard
</header>

<div class="container">

<div class="card">
<h2>設備總數</h2>
<h1>3</h1>
</div>

<div class="card">
<h2>使用者</h2>
<h1>3</h1>
</div>

<table>

<tr>
<th>Device</th>
<th>User</th>
<th>Platform</th>
<th>Status</th>
</tr>

<tr>
<td>iPhone 15</td>
<td>Jason</td>
<td>iOS</td>
<td class="online">Online</td>
</tr>

<tr>
<td>Galaxy S24</td>
<td>Amy</td>
<td>Android</td>
<td class="online">Online</td>
</tr>

<tr>
<td>iPad Air</td>
<td>Tom</td>
<td>iPadOS</td>
<td class="offline">Offline</td>
</tr>

</table>

</div>

</body>
</html>
